name = "booru-today"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Scheduled daily trigger at 8:00 AM UTC+7 (01:00 UTC)
[triggers]
crons = ["0 1 * * *"]

[vars]
# Danbooru username for API access
DANBOORU_LOGIN = "glowingnec"
# Bot owner username (without @, case-insensitive)
OWNER_USERNAME = "cheytac29"
# Default source: "danbooru" or "yandere"
DEFAULT_SOURCE = "danbooru"
# Default rating filter: "sfw", "nsfw", or "all"
DEFAULT_RATING = "sfw"
# If true, only @cheytac29 can trigger bot commands. If false, anyone can request images, but only owner can change settings.
RESTRICT_ALL_TO_OWNER = "false"

# Secrets required (configure in Cloudflare Dashboard -> Variables & Secrets):
# - TELEGRAM_BOT_TOKEN: Your Telegram bot token from @BotFather
# - DANBOORU_API_KEY: Your Danbooru API key (encrypted secret)
